name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AutoCapture.sln
      - run: dotnet build AutoCapture.sln -c Release --no-restore
      - run: dotnet test AutoCapture.sln -c Release --no-build --logger trx
      - run: dotnet publish AutoCapture.Wpf -c Release -r win-x64 --self-contained true -o artifacts/AutoCapture-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: AutoCapture-win-x64
          path: artifacts/AutoCapture-win-x64/
